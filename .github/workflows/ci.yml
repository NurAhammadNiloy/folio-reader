name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system tools (Poppler for independent export checks)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Install Playwright Chromium (also used to print the Unicode fixture)
        run: npx playwright install --with-deps chromium
      - run: npm run fixtures
      - run: npm run test
      - run: npm run build
      - name: E2E against the production build with service worker
        run: npm run test:e2e -- --project=chromium --trace off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run fixtures
      - run: npm run build
      - name: WebKit smoke (engine check only; not iPad or Apple Pencil evidence)
        env:
          FOLIO_WEBKIT: '1'
        run: npm run test:e2e -- --project=webkit tests/e2e/smoke.spec.ts --trace off
